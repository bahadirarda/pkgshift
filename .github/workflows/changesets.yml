name: changesets

on:
  push:
    branches: [main]

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: changesets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version-pull-request:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal

      - name: Create or update version pull request
        id: changesets
        uses: changesets/action@198f833dd7d863100ea6e28967bc9a9fdefadb0a # v2.1.0
        with:
          version-script: bun run version:packages
          commit-message: "build(release): version packages"
          pr-title: "build(release): version packages"
          create-github-releases: false
          push-git-tags: false

      - name: Dispatch version pull request validation
        if: steps.changesets.outputs['pr-number'] != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_BRANCH: changeset-release/${{ github.ref_name }}
        run: gh workflow run ci.yml --ref "$VERSION_BRANCH"

      - name: Curate calendar version pull request
        if: steps.changesets.outputs['pr-number'] != ''
        id: calendar-release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_BRANCH: changeset-release/${{ github.ref_name }}
          VERSION_PR_NUMBER: ${{ steps.changesets.outputs['pr-number'] }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$VERSION_BRANCH"
          body_path="$RUNNER_TEMP/calendar-release-pr.md"
          release_version="$(
            bun implementations/typescript/scripts/release-pr-body.ts \
              --ref "origin/$VERSION_BRANCH" \
              --output "$body_path"
          )"
          gh pr edit "$VERSION_PR_NUMBER" \
            --title "build(release): pkgshift $release_version" \
            --body-file "$body_path"

      - name: Remove redundant approval placeholder
        if: steps.changesets.outputs['pr-number'] != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_BRANCH: changeset-release/${{ github.ref_name }}
          VERSION_PR_NUMBER: ${{ steps.changesets.outputs['pr-number'] }}
        shell: bash
        run: |
          set -euo pipefail
          version_sha="$(gh pr view "$VERSION_PR_NUMBER" --json headRefOid --jq .headRefOid)"

          for attempt in {1..15}; do
            mapfile -t placeholder_run_ids < <(
              gh api --method GET "repos/$GITHUB_REPOSITORY/actions/runs" \
                -f event=pull_request \
                -f branch="$VERSION_BRANCH" \
                -f status=action_required \
                -f per_page=100 \
                --jq ".workflow_runs[] | select(.head_sha == \"$version_sha\") | .id"
            )

            if (( ${#placeholder_run_ids[@]} > 0 )); then
              for run_id in "${placeholder_run_ids[@]}"; do
                gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/runs/$run_id"
              done
              exit 0
            fi

            sleep 2
          done

          echo "No approval-only placeholder was created for $version_sha."
