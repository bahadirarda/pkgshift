name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  typescript-and-knowledge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate
        run: bun run check:typescript

      - name: Build TypeScript reference
        run: bun run build:typescript

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt

      - name: Validate Rust workspace
        run: cargo fmt --all --check && cargo clippy --workspace --all-targets -- -D warnings && cargo test --workspace

      - name: Build Rust release binary
        run: cargo build --workspace --release --locked
