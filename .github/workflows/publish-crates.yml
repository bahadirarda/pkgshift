name: publish crates.io

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Annotated release tag to publish, for example v0.1.0
        required: true
        type: string
      confirm:
        description: I understand crates.io versions are permanent
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: crates-io-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    if: inputs.confirm == true
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: crates-io
      url: https://crates.io/crates/pkgshift
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Verify release tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "The publication tag must be a stable v-prefixed Semantic Version."
            exit 1
          fi
          if [[ "$(git cat-file -t "refs/tags/$RELEASE_TAG")" != "tag" ]]; then
            echo "Publication requires an annotated release tag."
            exit 1
          fi
          git fetch origin main
          tag_commit="$(git rev-list -n 1 "$RELEASE_TAG")"
          if ! git merge-base --is-ancestor "$tag_commit" origin/main; then
            echo "Publication tag must point to a commit reachable from main."
            exit 1
          fi

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate synchronized version metadata
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: bun run version:check

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal

      - name: Test and package crates
        run: |
          cargo test --workspace --locked
          cargo package --package pkgshift-core --locked
          cargo package --workspace --locked --no-verify

      - name: Publish crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          if [[ -z "$CARGO_REGISTRY_TOKEN" ]]; then
            echo "The crates-io environment requires CARGO_REGISTRY_TOKEN."
            exit 1
          fi

          version="${RELEASE_TAG#v}"
          is_published() {
            curl --fail --silent --show-error \
              --header "User-Agent: pkgshift-release-workflow" \
              "https://crates.io/api/v1/crates/$1/$version" >/dev/null
          }

          if is_published pkgshift-core; then
            echo "pkgshift-core $version is already published."
          else
            cargo publish --package pkgshift-core --locked
          fi

          for attempt in {1..30}; do
            if is_published pkgshift-core; then
              break
            fi
            if [[ "$attempt" == "30" ]]; then
              echo "pkgshift-core $version did not become visible in time."
              exit 1
            fi
            sleep 10
          done

          if is_published pkgshift; then
            echo "pkgshift $version is already published."
          else
            cargo publish --package pkgshift --locked
          fi
