[package]
name = "pkgshift"
description = "Transactional package manager migration CLI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true
documentation = "https://docs.rs/pkgshift"
readme = "README.md"
keywords = ["package-manager", "migration", "cli", "codemod", "automation"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["package.json"]

[[bin]]
name = "pkgshift"
path = "src/main.rs"

[dependencies]
clap.workspace = true
pkgshift-core = { version = "0.20260817.4", path = "../pkgshift-core" }
serde_json.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
